[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metabolic-plm"
version = "0.1.0"
description = "Fine-tuning ESM-2 on homology-clustered microbial metabolic phenotypes validated via COBRApy FBA."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cobra>=0.29.0",
    "hydra-core>=1.3.2",
    "pandas>=2.2.0",
    "peft>=0.13.0",
    "pyarrow>=17.0.0",
    "requests>=2.32.0",
    "scikit-learn>=1.5.0",
    "torch>=2.4.0",
    "transformers>=4.45.0",
    "wandb>=0.18.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.8.0",
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/metabolic_plm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
