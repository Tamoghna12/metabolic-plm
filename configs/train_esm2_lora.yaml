# Hydra Configuration: "Leakage vs. Reality" Ablation Run (RTX 4070 12GB + W&B)
# Run A (Naive Baseline): uv run python -m metabolic_plm.train split.strategy=random
# Run B (Homology-Split): uv run python -m metabolic_plm.train split.strategy=homology
seed: 42

paths:
  data_dir: "data"
  raw_models_dir: "${paths.data_dir}/raw/bigg"
  processed_dataset: "${paths.data_dir}/processed/metabolic_dataset.parquet"
  fasta_path: "${paths.data_dir}/processed/sequences.fasta"
  splits_dir: "${paths.data_dir}/splits"
  output_dir: "outputs/${split.strategy}_esm2_650m_lora"

split:
  strategy: "homology"       # Options: "random" (Run A: 70/15/15) or "homology" (Run B: MMseqs2 30% ID)
  min_seq_id: 0.30           # Strict 30% sequence identity threshold
  coverage: 0.80             # Alignment coverage threshold (-c 0.8)
  cov_mode: 0                # Bidirectional coverage mode
  train_ratio: 0.70          # 70 / 15 / 15 split
  val_ratio: 0.15
  test_ratio: 0.15
  mmseqs_binary: "mmseqs"

model:
  pretrained_model_name: "facebook/esm2_t33_650M_UR50D"
  num_labels: 1              # Binary essentiality logit with BCEWithLogitsLoss(pos_weight=5.06)
  max_length: 1022           # 1022 residues (+ <cls> and <eos> = 1024 tokens) with dynamic batch padding
  gradient_checkpointing: true
  lora:
    r: 8
    lora_alpha: 16
    lora_dropout: 0.1
    bias: "none"
    target_modules:
      - "query"
      - "key"
      - "value"
  classifier_dropout: 0.1

training:
  precision: "bf16"
  per_device_batch_size: 4
  per_device_eval_batch_size: 8
  grad_accumulation_steps: 8   # Effective batch size = 32 on 12GB RTX 4070
  optimizer: "adamw"
  lr: 3.0e-4
  weight_decay: 0.01
  lr_scheduler: "cosine"
  warmup_ratio: 0.10           # Cosine schedule with 10% warmup
  pos_weight: 5.06             # Essentiality class imbalance weight (neg / pos = 2851 / 565 ≈ 5.05)
  max_grad_norm: 1.0
  epochs: 5                    # 5-10 epochs recommended
  num_workers: 2

wandb:
  enabled: true
  mode: "online"               # Set to "offline" if running without internet
  project: "metabolic-plm"
  entity: null
  run_name: "${split.strategy}_split_esm2_650m_lora_r8"
  tags:
    - "esm2-650m"
    - "lora-r8"
    - "bf16"
    - "rtx4070"
    - "${split.strategy}"
